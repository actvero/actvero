resolver 127.0.0.11 valid=10s ipv6=off;
client_max_body_size 64m;
proxy_http_version 1.1;
proxy_buffering off;
proxy_request_buffering off;
proxy_cache off;
# Allow the maximum configurable first-response/idle wait (3600s) plus cleanup.
proxy_read_timeout 3700s;
proxy_send_timeout 3700s;
proxy_connect_timeout 10s;
proxy_set_header Connection "";
proxy_set_header Host $public_authority;
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host $public_authority;
proxy_set_header X-Forwarded-Proto $public_scheme;
proxy_set_header X-Forwarded-Port $public_port;
proxy_set_header X-Forwarded-Prefix "";
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Original-URL "";
proxy_set_header X-Original-Method "";
proxy_set_header X-Original-Forwarded-For "";
proxy_set_header X-Forwarded-Access-Token "";
proxy_set_header X-Forwarded-Client-Cert "";
# No application credentials go to identity static files/admin or vice versa.
location /identity/realms/actvero/ {
    set $identity_target keycloak-edge:8080;
    proxy_pass http://$identity_target;
}
location /identity/resources/ {
    set $identity_target keycloak-edge:8080;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_pass http://$identity_target;
}
location = /identity { return 404; }
location /identity/ { return 404; }
location / {
    set $app_target app-edge:8080;
    proxy_pass http://$app_target;
}
