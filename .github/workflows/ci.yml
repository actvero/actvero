name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: actvero_test
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: actvero_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U actvero_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ACTVERO_DATABASE_URL: postgresql+asyncpg://actvero_test:isolated-ci-password@127.0.0.1:5432/actvero_test
      ACTVERO_TEST_DATABASE_URL: postgresql+asyncpg://actvero_test:isolated-ci-password@127.0.0.1:5432/actvero_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install locked tool versions
        run: |
          python -m pip install uv==0.12.7
          npm install --global pnpm@11.25.0
      - name: Public content policy
        run: |
          make public-check
          python3 scripts/test-public-content.py
      - name: Install dependencies
        run: |
          uv sync --frozen --directory backend
          uv sync --frozen --directory cli
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend exec playwright install chromium --with-deps
      - name: Static checks and builds
        run: make check cli-check
      - name: Browser tests
        run: pnpm --dir frontend test
      - name: Application tests
        run: make test cli-test
      - name: Identity and deployment tests
        run: |
          python3 scripts/test-identity-theme-assets.py
          python3 scripts/test-server.py
          python3 scripts/test-server-remote.py
          node --test scripts/test-identity-account-switch.mjs
