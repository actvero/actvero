name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned New API integration
        run: docker build --tag actvero-newapi:test integrations/newapi
      - name: Verify bootstrap and organization separation
        run: |
          docker run --detach --name actvero-newapi-test --publish 127.0.0.1:5300:3000 \
            --env ACTVERO_ORGANIZATION_ISOLATION=true \
            --env ACTVERO_BOOTSTRAP_TOKEN=nap_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --env SESSION_SECRET=isolated-gateway-runtime-test actvero-newapi:test
          python3 - <<'PY'
          import json, time
          from urllib.request import Request, urlopen
          for attempt in range(60):
              try:
                  with urlopen('http://127.0.0.1:5300/api/status', timeout=2) as response:
                      status = json.load(response)
                  if status['success'] and status['data']['actvero_organization_isolation']:
                      break
              except (OSError, ValueError, KeyError):
                  pass
              time.sleep(1)
          else:
              raise SystemExit('Gateway did not become ready')
          identities = []
          for owner in ['00000000-0000-4000-8000-000000000001', '00000000-0000-4000-8000-000000000002']:
              request = Request('http://127.0.0.1:5300/api/actvero/organizations/' + owner + '/connect',
                                method='POST', headers={'Authorization': 'Bearer nap_' + 'a' * 64})
              with urlopen(request, timeout=10) as response:
                  packet = json.load(response)
              assert packet['success'] is True
              identities.append(packet['data'])
          assert identities[0]['namespace'] != identities[1]['namespace']
          assert identities[0]['relay_key'] != identities[1]['relay_key']
          assert identities[0]['relay_token_id'] != identities[1]['relay_token_id']
          print('Gateway image bootstrap and organization separation passed')
          PY
      - name: Stop disposable gateway
        if: always()
        run: docker rm --force actvero-newapi-test || true
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: actvero_test
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: actvero_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U actvero_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ACTVERO_DATABASE_URL: postgresql+asyncpg://actvero_test:isolated-ci-password@127.0.0.1:5432/actvero_test
      ACTVERO_TEST_DATABASE_URL: postgresql+asyncpg://actvero_test:isolated-ci-password@127.0.0.1:5432/actvero_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install locked tool versions
        run: |
          python -m pip install uv==0.12.7
          npm install --global pnpm@11.25.0
      - name: Public content policy
        run: |
          make public-check
          python3 scripts/test-public-content.py
      - name: Install dependencies
        run: |
          uv sync --frozen --directory backend
          uv sync --frozen --directory cli
          npm ci --prefix cli
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend exec playwright install chromium --with-deps
      - name: Static checks and builds
        run: make check cli-check cli-legacy-check
      - name: Browser tests
        run: pnpm --dir frontend test
      - name: Application tests
        run: make test cli-test cli-legacy-test
      - name: Identity and deployment tests
        run: |
          python3 scripts/test-identity-theme-assets.py
          python3 scripts/test-server.py
          python3 scripts/test-server-remote.py
          node --test scripts/test-identity-account-switch.mjs
